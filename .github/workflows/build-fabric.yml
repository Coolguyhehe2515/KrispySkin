name: Build KrispySkin Fabric Mod

on:
  push:
    branches:
      - fabric

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project files
        run: |
          echo "=== Project files ==="
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Gradle project
        run: |
          echo "=== Gradle files ==="
          ls -la

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle or build.gradle.kts not found!"
            exit 1
          fi

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Fabric Mod
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: List build output
        run: |
          echo "=== Build output ==="
          find build/libs -maxdepth 1 -type f -print

      - name: Upload Fabric Mod
        uses: actions/upload-artifact@v4
        with:
          name: KrispySkin-Fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
