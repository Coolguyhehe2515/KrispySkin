name: Build KrispySkin Paper Plugin

on:
  push:
    branches:
      - plugin

  pull_request:
    branches:
      - plugin

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: gradle clean build --stacktrace

      - name: Show build output
        if: always()
        run: |
          echo "=== build/libs ==="
          if [ -d "build/libs" ]; then
            ls -lah build/libs
          else
            echo "build/libs does not exist"
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KrispySkin-Paper-Plugin
          path: build/libs/*.jar
          if-no-files-found: error
