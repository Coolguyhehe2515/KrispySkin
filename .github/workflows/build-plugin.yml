name: Build KrispySkin Paper Plugin

on:
  push:
    branches:
      - plugin

  pull_request:
    branches:
      - plugin

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KrispySkin-Paper-Plugin
          path: build/libs/*.jar
          if-no-files-found: error
