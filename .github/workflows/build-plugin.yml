name: Build KrispySkin Paper Plugin

on:
  push:
    branches:
      - plugin

  pull_request:
    branches:
      - plugin

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show project files
        run: |
          echo "=== Repository ==="
          pwd
          echo
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Gradle
        run: |
          echo "=== Gradle files ==="
          ls -la
          echo
          if [ -f "./gradlew" ]; then
            echo "gradlew found"
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Build plugin
        run: ./gradlew clean build --stacktrace

      - name: List build output
        if: always()
        run: |
          echo "=== build/libs ==="
          if [ -d "build/libs" ]; then
            ls -lah build/libs
          else
            echo "build/libs does not exist"
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KrispySkin-Paper-Plugin
          path: build/libs/*.jar
          if-no-files-found: error
